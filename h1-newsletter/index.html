<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>ניוזלטר כיתה ה1 – ביכורים המכיל</title>
<style>
:root{--g:#7ab648;--b:#3aa0d8;--o:#f39a2b;--p:#e9568f;--y:#f7c928;--t:#5f6368}
*{box-sizing:border-box}body{margin:0;font-family:"Assistant","Rubik",Arial,sans-serif;background:#fdf8ef;color:#333;line-height:1.6}
.wrap{max-width:720px;margin:auto;padding:16px}
header{text-align:center;background:#fff;border-radius:20px;padding:18px;box-shadow:0 2px 8px #0001;border-top:6px solid;border-image:linear-gradient(90deg,var(--g),var(--b),var(--o),var(--p),var(--y)) 1}
header img{max-width:230px;width:70%}h1{margin:8px 0 2px;color:var(--t);font-size:1.7em}.sub{color:#888;margin:0}
.share{margin-top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.share button,.share a{border:0;border-radius:999px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer;color:#fff;text-decoration:none}
.btn-share{background:var(--b)}.btn-wa{background:#25d366}.btn-copy{background:var(--o)}
.demo{background:var(--p);color:#fff;text-align:center;font-weight:800;padding:10px;border-radius:12px;margin-bottom:12px;font-size:1.15em}
.issue{background:#fff;border-radius:18px;padding:16px 18px;margin:18px 0;box-shadow:0 2px 8px #0001}
.issue.latest{border:3px solid var(--y)}.issue h2{margin:0 0 8px;color:var(--t)}
.new{background:var(--p);color:#fff;font-size:.6em;padding:2px 10px;border-radius:999px;vertical-align:middle}
.s{border-right:5px solid;padding:4px 12px;margin:12px 0;border-radius:4px;background:#fafafa}
.s h3{margin:4px 0}.imp{border-color:var(--o)}.lrn{border-color:var(--g)}.hw{border-color:var(--b)}
.subj p{margin:0 0 8px}ul{margin:4px 0;padding-right:20px}
.sig{margin-top:14px;font-weight:700;color:var(--t)}.empty{text-align:center;color:#888}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:8px 16px;border-radius:999px;display:none}
</style></head><body><div class="wrap">
